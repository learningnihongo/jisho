name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'LensJisho v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Restore Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        id: build_apk
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Files
        id: apk-prep
        run: |
          mkdir -p release-apks
          
          # Find generated debug APK
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found after build!"
            exit 1
          fi
          
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" release-apks/LensJisho-v1.0.0.apk
          cp "$APK_FILE" release-apks/LensJisho-universal.apk
          
          ls -lh release-apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LensJisho-APK
          path: release-apks/*.apk
          retention-days: 30

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="LensJisho ${TAG}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title || github.event.inputs.tag_name }}"
          else
            TAG="v1.0.0"
            TITLE="LensJisho v1.0.0 (Latest)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT
          echo "Target Release: ${TAG} - ${TITLE}"

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 📱 LensJisho Android App (${{ steps.release_info.outputs.tag }})

          ### ✨ Key Features:
          - 📷 **Google Lens Camera OCR**: Live Japanese text scan & recognition with instant viewfinder.
          - 📖 **Jisho.org Integration**: Full Japanese-English-Burmese dictionary lookup, Kanji radicals, JLPT levels (N5-N1).
          - 🇲🇲 **Google Translate**: Sentence translation between Japanese and Myanmar (Burmese) / English.
          - 📑 **Grammar & Particles Guide**: Particle analysis (`は`, `が`, `を`, `に`, `で`) and verb conjugations.
          - 🗂️ **Saved Vocabulary Notebook & Anki CSV Export**: Save words, study with Flashcard Quiz, and export directly to Anki!

          ### 📥 Download & Install:
          - Download **`LensJisho-v1.0.0.apk`** below.
          - Open the APK on your Android device to install (supports Android 7.0+).
          EOF

      - name: Publish GitHub Release (gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          TITLE: ${{ steps.release_info.outputs.title }}
        run: |
          echo "Publishing release $TAG with title: $TITLE"
          
          # Try to create git tag if it doesn't already exist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" || true
          git push -f origin "$TAG" || true

          # Create release if not existing, or update assets if already existing
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/overwriting APK assets..."
            gh release upload "$TAG" release-apks/*.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-apks/*.apk \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --draft=false \
              --prerelease=false
          fi
          echo "Release completed successfully!"
