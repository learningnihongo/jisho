name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'LensJisho v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build APK with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifacts
        id: apk-prep
        run: |
          VERSION_NAME="1.0.0"
          mkdir -p release-apks
          
          # Copy universal APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/LensJisho-v${VERSION_NAME}-universal.apk
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/LensJisho-v${VERSION_NAME}-debug.apk
            echo "Universal APK created successfully."
          fi
          
          # Check if release APK was also produced
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/LensJisho-v${VERSION_NAME}-release.apk
          fi
          
          ls -la release-apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LensJisho-APK
          path: release-apks/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.0.0-${{ github.run_number }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target tag is ${TAG}"

      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ github.event.inputs.release_title || steps.release_tag.outputs.tag }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 LensJisho Android Release (${{ steps.release_tag.outputs.tag }})
            
            ### ✨ Features Included:
            - 📷 **Google Lens Camera OCR**: Live Japanese text scan & recognition with instant laser viewfinder.
            - 📖 **Jisho.org Integration**: Full Japanese-English-Burmese dictionary lookup, Kanji radicals, JLPT levels (N5-N1).
            - 🇲🇲 **Google Translate**: Full text and sentence translation between Japanese and Myanmar (Burmese) / English.
            - 📑 **Grammar & Particles Guide**: Particle analysis (`は`, `が`, `を`, `に`, `で`) and verb conjugations.
            - 🗂️ **Saved Vocabulary Notebook & Anki CSV Export**: Save words, study with Flashcard Quiz, and export directly to Anki!
            
            ### 📥 Download & Install:
            - Download `LensJisho-v1.0.0-universal.apk` below and install directly on your Android phone!
            - Compatible with Android 7.0 (API 24) up to Android 16 (API 36).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
